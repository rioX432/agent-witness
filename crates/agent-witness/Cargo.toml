[package]
name = "agent-witness"
version = "0.0.4"
description = "A session recorder and audit log for AI coding agents"
homepage = "https://github.com/rioX432/agent-witness"
readme = "../../README.md"
keywords = ["claude", "agent", "audit", "observability", "cli"]
categories = ["command-line-utilities", "development-tools"]
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agent-witness-core = { path = "../witness-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
ratatui = { workspace = true }
base64 = "0.22.1"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true }

# cargo-binstall metadata. Matches the archive naming/layout produced by 'dist'
# (verified via `dist build`): archive `agent-witness-<target>.tar.xz` contains
# a top-level `agent-witness-<target>/` dir holding the binary.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.xz"
pkg-fmt = "txz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
