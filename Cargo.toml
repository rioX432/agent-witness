[workspace]
resolver = "2"
members = ["crates/witness-core", "crates/agent-witness"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rioX432/agent-witness"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
# TUI: ratatui bundles its matching crossterm backend and re-exports it as
# `ratatui::crossterm`, so we depend on ratatui alone to avoid version skew.
ratatui = "0.30"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "io-std",
    "signal",
    "sync",
    "time",
] }
