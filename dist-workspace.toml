[workspace]
members = ["cargo:."]

# Config for 'dist' (axodotdev/cargo-dist).
# See docs/adr/0004-distribution-cargo-dist.md for tool-choice rationale.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax).
cargo-dist-version = "0.32.0"
# CI backends to support.
ci = "github"
# Installers to generate for each app in the workspace.
installers = ["shell", "homebrew"]
# The archive format used for windows builds (unused: no windows target).
windows-archive = ".zip"
# The archive format used for non-windows builds.
unix-archive = ".tar.xz"
# A GitHub repo to push Homebrew formulas to.
tap = "rioX432/homebrew-tap"
# Publish jobs to run in CI.
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
# Whether dist should create a Github Release or use an existing draft.
create-release = true
# Which actions to run on pull requests (plan-only: validate, never upload).
pr-run-mode = "plan"
# Whether to install an updater program alongside the software.
install-updater = false
# Path that installers should place binaries in.
install-path = "CARGO_HOME"
